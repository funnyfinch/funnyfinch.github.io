<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>{{TITLE}} | finch</title>

    <meta
        name="description"
        content="{{DESCRIPTION}}"
    >

    <link
        rel="icon"
        type="image/svg+xml"
        href="{{ROOT}}assets/logo.svg"
    >

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Baloo+Da+2:wght@400;500;600;700&family=Instrument+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <script>
        (() => {
            const saved = localStorage.getItem("theme");

            const theme =
                saved === "light" || saved === "dark"
                    ? saved
                    : (
                        window.matchMedia(
                            "(prefers-color-scheme: dark)"
                        ).matches
                            ? "dark"
                            : "light"
                    );

            document.documentElement.dataset.theme = theme;
        })();
    </script>

    <link
        rel="stylesheet"
        href="{{ROOT}}style.css"
    >

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/themes/prism-tomorrow.min.css"
    >

</head>

<body class="site-body">

    {{MAIN_NAV}}

    {{SUB_NAV}}

    <main class="docs-shell">

        <aside class="docs-sidebar">

            <div class="docs-sidebar__inner">

                <div class="docs-sidebar__heading">
                    <h2>
                        {{SECTION_TITLE}}
                    </h2>
                </div>

                <nav
                    class="docs-sidebar__nav"
                    aria-label="Documentation navigation"
                >
                    {{SIDEBAR}}
                </nav>

            </div>

        </aside>

        <section class="docs-content">

            <div class="docs-content__inner">

                <article class="markdown-body js-doc-content">
                    {{CONTENT}}
                </article>

            </div>

        </section>

    </main>

    <script src="{{ROOT}}script.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/prism.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-lua.min.js"></script>

</body>

</html>
