<header class="topbar">

    <a
        class="brandmark"
        href="{{ROOT}}index.html"
        aria-label="Go to homepage"
    >
        <img
            src="{{ROOT}}assets/logo.svg"
            class="brandmark__logo"
            alt=""
        >

        <span class="brandmark__text">
            finch
        </span>
    </a>

    <nav
        class="topbar-nav js-site-nav"
        id="site-nav"
        aria-label="Primary navigation"
    >
        <a
            href="{{ROOT}}index.html"
            {{HOME_CURRENT}}
        >
            home
        </a>

        <a
            href="{{ROOT}}projects/index.html"
            {{PROJECTS_CURRENT}}
        >
            projects
        </a>

        <a
            href="{{ROOT}}tutorials/index.html"
            {{TUTORIALS_CURRENT}}
        >
            tutorials
        </a>

        <a
            href="{{ROOT}}plugins/index.html"
            {{PLUGINS_CURRENT}}
        >
            plugins
        </a>
    </nav>

    <div class="topbar-actions">

        <button
            class="theme-toggle"
            type="button"
            aria-label="Toggle theme"
        >
            <svg
                class="theme-toggle__sun"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
            >
                <circle cx="12" cy="12" r="4"></circle>
                <path d="M12 2v2"></path>
                <path d="M12 20v2"></path>
                <path d="m4.93 4.93 1.41 1.41"></path>
                <path d="m17.66 17.66 1.41 1.41"></path>
                <path d="M2 12h2"></path>
                <path d="M20 12h2"></path>
                <path d="m6.34 17.66-1.41 1.41"></path>
                <path d="m19.07 4.93-1.41 1.41"></path>
            </svg>

            <svg
                class="theme-toggle__moon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
            >
                <path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a6.5 6.5 0 0 0 9.8 9.8Z"></path>
            </svg>
        </button>

        <a
            class="github-link"
            href="https://github.com/funnyfinch"
            target="_blank"
            rel="noreferrer"
            aria-label="GitHub"
            title="GitHub"
        >
            <svg
                viewBox="0 0 24 24"
                fill="currentColor"
                aria-hidden="true"
            >
                <path d="M12 2C6.48 2 2 6.58 2 12.24c0 4.53 2.87 8.37 6.84 9.72.5.1.68-.22.68-.49v-1.72c-2.78.62-3.37-1.37-3.37-1.37-.46-1.2-1.11-1.52-1.11-1.52-.91-.64.07-.63.07-.63 1 .08 1.53 1.06 1.53 1.06.9 1.58 2.36 1.12 2.94.86.09-.67.35-1.12.64-1.38-2.22-.26-4.56-1.14-4.56-5.07 0-1.12.39-2.03 1.03-2.75-.1-.26-.45-1.3.1-2.71 0 0 .84-.28 2.75 1.05A9.24 9.24 0 0 1 12 7.92c.85 0 1.71.12 2.51.36 1.91-1.33 2.75-1.05 2.75-1.05.55 1.41.2 2.45.1 2.71.64.72 1.03 1.63 1.03 2.75 0 3.94-2.34 4.81-4.57 5.06.36.32.68.94.68 1.9v1.82c0 .27.18.59.69.49A10.27 10.27 0 0 0 22 12.24C22 6.58 17.52 2 12 2Z"></path>
            </svg>
        </a>

        <button
            class="nav-toggle js-nav-toggle"
            type="button"
            aria-expanded="false"
            aria-controls="site-nav"
        >
            Menu
        </button>

    </div>

</header>
